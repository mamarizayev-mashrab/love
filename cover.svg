<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FDE2E4"/>
      <stop offset="100%" stop-color="#FFD6E0"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E8E"/>
      <stop offset="100%" stop-color="#FF2A65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF2A65" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#C05070" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fon -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Ambient doiralar -->
  <circle cx="150" cy="120" r="220" fill="#FFC0CB" opacity="0.45" filter="blur(60px)"/>
  <circle cx="1080" cy="500" r="260" fill="#E6C2EB" opacity="0.5" filter="blur(70px)"/>

  <!-- Markaziy Glassmorphism Card -->
  <rect x="250" y="95" width="700" height="440" rx="36" fill="#FFFFFF" fill-opacity="0.75" stroke="#FFFFFF" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Yurak belgisi -->
  <g transform="translate(600, 210) scale(2.8)" filter="url(#shadow)">
    <path d="M0 8.5l-1.45-1.32C-6.6 2.36 -10 -0.72 -10 -4.5 -10 -7.58 -7.58 -10 -4.5 -10c1.74 0 3.41.81 4.5 2.09C1.09 -9.19 2.76 -10 4.5 -10 7.58 -10 10 -7.58 10 -4.5c0 3.78-3.4 6.86-8.55 11.54L0 8.5z" fill="url(#heartGrad)"/>
  </g>

  <!-- Yozuvlar -->
  <text x="600" y="325" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#2D1A25" text-anchor="middle">
    Birga uchrashuvga chiqamizmi? ✨
  </text>
  
  <text x="600" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#7E6273" text-anchor="middle">
    Senga atalgan kichik bir romantik taklifnoma...
  </text>

  <!-- Tugma bezaklari -->
  <g transform="translate(430, 420)">
    <rect width="160" height="52" rx="26" fill="url(#heartGrad)"/>
    <text x="80" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Ha 💖
    </text>
  </g>

  <g transform="translate(610, 420)">
    <rect width="160" height="52" rx="26" fill="#FFFFFF" stroke="#E6A0B9" stroke-width="1.5"/>
    <text x="80" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#695261" text-anchor="middle">
      Yo'q
    </text>
  </g>
</svg>
